<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>step progress indicator (Variant 25)</title>
  <style>
    :root {
      --primary: hsl(95, 75%, 55%);
      --bg: #090d16;
      --card: #131c2e;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .widget-container {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 1.75rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .widget-title {
      color: var(--primary);
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
    }
    .widget-desc {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .action-btn {
      margin-top: 1.25rem;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="widget-container">
    <h3 class="widget-title">step progress indicator (Variant 25)</h3>
    <p class="widget-desc">Component implementation demonstrating modern CSS layout tokens and interactive transitions.</p>
    <button class="action-btn" onclick="alert('Component active')">Interact</button>
  </div>
</body>
</html>
